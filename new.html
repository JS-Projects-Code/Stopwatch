<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="icon" type="image/png" href="stopwatch_icon-removebg-preview (1).png">
    <link rel="stylesheet" href="new.css">
</head>
<body>
    <img src="stopwatch-removebg-preview (1).png" alt="Stopwatch" width="450vh" height="250vh">

    <div id="container">
        <div id="display">
            00:00:00:00
        </div>
        <div id="controls">
            <button id="startBtn" onclick="start()">Start</button>
            <button id="stopBtn" onclick="stop()">Stop</button>
            <button id="resetBtn" onclick="reset()">Reset</button>
        </div>
    </div>


    <script src="new.js"></script>
</body>
</html>
